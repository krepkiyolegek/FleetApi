name: CI/CD Pipeline to Docker Hub

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем код (Обновлено до свежей версии v4)
      - name: Check out repository
        uses: actions/checkout@v4

      # 2. ДОБАВЛЕНО: Включаем современный движок сборки Docker (Buildx). 
      # Именно это решает ошибку с метаданными и путаницей реестров!
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Логинимся в Docker Hub (Обновлено до v3)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Сборка Backend
      - name: Build and push Backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: krepkiyolegek/fleet-api:latest 

      # 5. Сборка Frontend
      - name: Build and push Frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: krepkiyolegek/fleet-frontend:latest