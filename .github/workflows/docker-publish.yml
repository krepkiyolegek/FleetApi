name: CI/CD Pipeline to Docker Hub

# Запускать робота при каждом пуше в ветку main
on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Скачиваем твой код из репозитория
      - name: Check out repository
        uses: actions/checkout@v3

      # 2. Логинимся в Docker Hub (используем секреты, которые ты добавил)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Собираем Docker-образ и отправляем на Docker Hub
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # Замени ТВОЙ_ЛОГИН на логин Docker Hub!
          tags: krepkiyolegek/fleet-api:latest