<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Автопарк Дашборд (Защищенный)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        
        <!-- БЛОК 1: АВТОРИЗАЦИЯ (Виден, если нет токена) -->
        <div id="loginSection" class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title text-center mb-4">Вход в систему</h4>
                        <form id="loginForm">
                            <div class="mb-3">
                                <input type="text" id="username" class="form-control" placeholder="Логин" required>
                            </div>
                            <div class="mb-3">
                                <input type="password" id="password" class="form-control" placeholder="Пароль" required>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Войти</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- БЛОК 2: ДАШБОРД (Скрыт по умолчанию - класс d-none) -->
        <div id="dashboardSection" class="d-none">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Управление автопарком</h2>
                <button class="btn btn-outline-danger" onclick="logout()">Выйти</button>
            </div>

            <div class="card mb-4 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title">Добавить / Редактировать автомобиль</h5>
                    <form id="carForm">
                        <input type="hidden" id="carId">
                        <div class="row">
                            <div class="col-md-2 mb-3">
                                <input type="text" id="make" class="form-control" placeholder="Марка" required>
                            </div>
                            <div class="col-md-2 mb-3">
                                <input type="text" id="model" class="form-control" placeholder="Модель" required>
                            </div>
                            <div class="col-md-2 mb-3">
                                <input type="number" id="year" class="form-control" placeholder="Год" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <input type="text" id="regNumber" class="form-control" placeholder="Госномер" required>
                            </div>
                            <div class="col-md-3 mb-3">
                                <input type="date" id="inspectionDate" class="form-control" required>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-primary" id="saveBtn">Сохранить</button>
                        <button type="button" class="btn btn-secondary d-none" id="cancelBtn" onclick="cancelEdit()">Отменить</button>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Марка</th>
                                <th>Модель</th>
                                <th>Год</th>
                                <th>Госномер</th>
                                <th>Техосмотр</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="carsTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ВНИМАНИЕ: Замени порт на свой!
        const BASE_URL = 'http://localhost:8080/api'; 
        let currentCars = [];

        // Проверяем статус при загрузке страницы
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('token')) {
                showDashboard();
            } else {
                showLogin();
            }
        });

        // --- УМНЫЙ FETCH (Обертка для защиты) ---
        // Эта функция автоматически добавляет токен ко всем запросам
        async function fetchWithAuth(url, options = {}) {
            const token = localStorage.getItem('token');
            
            // Если заголовков еще нет, создаем пустой объект
            if (!options.headers) options.headers = {};
            
            // Если токен есть, прикрепляем его как пропуск
            if (token) {
                options.headers['Authorization'] = `Bearer ${token}`;
            }

            const response = await fetch(url, options);

            // БЕЗОПАСНОСТЬ: Если сервер вернул 401 (токен протух или подделан), выкидываем юзера
            if (response.status === 401) {
                logout();
                alert('Сессия истекла. Пожалуйста, войдите снова.');
                throw new Error("Unauthorized");
            }
            return response;
        }

        // --- ЛОГИН ---
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                username: document.getElementById('username').value,
                password: document.getElementById('password').value
            };

            const res = await fetch(`${BASE_URL}/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (res.ok) {
                const data = await res.json();
                localStorage.setItem('token', data.token); // Сохраняем токен в браузер
                showDashboard();
            } else {
                alert('Неверный логин или пароль');
            }
        });

        // --- ВЫХОД ---
        function logout() {
            localStorage.removeItem('token'); // Удаляем токен
            showLogin();
        }

        // --- UI ПЕРЕКЛЮЧАТЕЛИ ---
        function showDashboard() {
            document.getElementById('loginSection').classList.add('d-none');
            document.getElementById('dashboardSection').classList.remove('d-none');
            loadCars();
        }

        function showLogin() {
            document.getElementById('dashboardSection').classList.add('d-none');
            document.getElementById('loginSection').classList.remove('d-none');
            document.getElementById('loginForm').reset();
        }

        // --- CRUD ОПЕРАЦИИ (Теперь используем fetchWithAuth вместо обычного fetch) ---

        async function loadCars() {
            const res = await fetchWithAuth(`${BASE_URL}/cars`);
            if (!res.ok) return;
            
            currentCars = await res.json();
            const tbody = document.getElementById('carsTableBody');
            tbody.innerHTML = '';
            currentCars.forEach(car => {
                tbody.innerHTML += `
                    <tr>
                        <td>${car.id}</td>
                        <td>${car.make}</td>
                        <td>${car.model}</td>
                        <td>${car.year}</td>
                        <td>${car.registrationNumber}</td>
                        <td>${new Date(car.lastInspectionDate).toLocaleDateString()}</td>
                        <td>
                            <button class="btn btn-sm btn-warning me-2" onclick="startEdit(${car.id})">Редактировать</button>
                            <button class="btn btn-sm btn-danger" onclick="deleteCar(${car.id})">Удалить</button>
                        </td>
                    </tr>`;
            });
        }

        document.getElementById('carForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('carId').value;
            const isEdit = id !== "";
            
            const carDto = {
                make: document.getElementById('make').value,
                model: document.getElementById('model').value,
                year: parseInt(document.getElementById('year').value),
                registrationNumber: document.getElementById('regNumber').value,
                lastInspectionDate: new Date(document.getElementById('inspectionDate').value).toISOString()
            };

            const url = isEdit ? `${BASE_URL}/cars/${id}` : `${BASE_URL}/cars`;
            
            const res = await fetchWithAuth(url, {
                method: isEdit ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(carDto)
            });

            if (res.ok) {
                cancelEdit();
                loadCars();
            } else {
                alert('Ошибка: ' + await res.text());
            }
        });

        function startEdit(id) {
            const car = currentCars.find(c => c.id === id);
            if (!car) return;
            document.getElementById('carId').value = car.id;
            document.getElementById('make').value = car.make;
            document.getElementById('model').value = car.model;
            document.getElementById('year').value = car.year;
            document.getElementById('regNumber').value = car.registrationNumber;
            document.getElementById('inspectionDate').value = car.lastInspectionDate.split('T')[0];
            
            document.getElementById('saveBtn').textContent = "Обновить";
            document.getElementById('cancelBtn').classList.remove('d-none');
        }

        function cancelEdit() {
            document.getElementById('carForm').reset();
            document.getElementById('carId').value = "";
            document.getElementById('saveBtn').textContent = "Сохранить";
            document.getElementById('cancelBtn').classList.add('d-none');
        }

        async function deleteCar(id) {
            if (!confirm('Удалить?')) return;
            await fetchWithAuth(`${BASE_URL}/cars/${id}`, { method: 'DELETE' });
            loadCars();
        }
    </script>
</body>
</html>
